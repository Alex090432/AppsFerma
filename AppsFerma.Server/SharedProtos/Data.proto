syntax = "proto3";

package CadFermaHub.MicroserviceServer;

message Table{
    repeated string header = 1;
    repeated string data = 2;
}

message File{
  string name = 1;         
  int32 size = 2;           
  bytes content = 3;        
  string extension = 4;    
  string hash = 5;          
  bool is_compressed = 6;   
}

message Data {
    repeated string input_paths = 1;
    repeated string output_paths = 2;
    repeated string info = 3;
    repeated File files= 4;
    Table table = 5;
    string params = 6; 
}
